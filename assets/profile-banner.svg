<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Hai Pham — software engineer and curious builder</title>
  <desc id="description">A dark blue and violet banner with a keyboard-inspired pattern and glowing cursor.</desc>
  <defs>
